name: Deploy to Cloudflare Workers

# Publishes the site to your own Cloudflare account on every push to main.
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - token with Workers Scripts: Edit, D1: Edit, Account Settings: Read
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
# Optional: SESSION_SECRET (recommended), ADMIN_EMAIL / ADMIN_NAME / ADMIN_PASSWORD
#           (ADMIN_* only apply the first time the database is seeded).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Ensure D1 database and wire its id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 create cafe90s-db >/dev/null 2>&1 || true
          DB_ID=$(npx wrangler d1 list --json | node -e '
            let raw = "";
            process.stdin.on("data", (d) => (raw += d)).on("end", () => {
              const list = JSON.parse(raw);
              const db = list.find((x) => x.name === "cafe90s-db");
              if (!db) { console.error("cafe90s-db not found after create"); process.exit(1); }
              process.stdout.write(db.uuid);
            });
          ')
          echo "Using D1 database id $DB_ID"
          node -e '
            const fs = require("fs");
            const file = "wrangler.jsonc";
            const id = process.argv[1];
            const next = fs.readFileSync(file, "utf8").replace(/"database_id"\s*:\s*"[^"]*"/, `"database_id": "${id}"`);
            fs.writeFileSync(file, next);
          ' "$DB_ID"
          grep -n "database_id" wrangler.jsonc

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          put() {
            local name="$1" value="${2:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" >/dev/null
              echo "set $name"
            fi
          }
          put SESSION_SECRET "$SESSION_SECRET"
          put ADMIN_EMAIL "$ADMIN_EMAIL"
          put ADMIN_NAME "$ADMIN_NAME"
          put ADMIN_PASSWORD "$ADMIN_PASSWORD"

      - name: Smoke test
        if: steps.deploy.outputs.url != ''
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          echo "Smoke testing $URL"
          code="000"
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/menu.json -w '%{http_code}' "$URL/api/menu" || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || { echo "menu endpoint returned $code"; exit 1; }
          node -e '
            const j = require("/tmp/menu.json");
            if (j.total !== 174) { console.error("unexpected seeded item count:", j.total); process.exit(1); }
            console.log("seeded menu items:", j.total, "categories:", j.categories.length);
          '
          echo "Live at $URL" >> "$GITHUB_STEP_SUMMARY"
